name: Build and deploy storybook
on:
  push:
    branches:
      - main
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v2.3.1
        with:
          persist-credentials: false
      - name: Setup Node 🟢
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: yarn
      - name: Install system dependencies 📦
        run: | # Required to build the native "canvas" module from source if no prebuilt binary matches
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev libpixman-1-dev
      - name: Install and build 🔧
        run: | # Install packages and build the Storybook files
          yarn
          yarn build-catalogue-meta
          yarn build-catalogue-markdown-docs
          yarn build-storybook          
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@3.6.2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: main # The branch the action should deploy to.
          FOLDER: docs-build # The folder that the build-storybook script generates files.
          CLEAN: true # Automatically remove deleted files from the deploy branch
          TARGET_FOLDER: docs # The folder that we serve our Storybook files from